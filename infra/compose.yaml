name: applyr
x-backend: &backend
  build:
    context: ..
    dockerfile: infra/Dockerfile.api
  env_file: ../.env.compose
  volumes: ['appstorage:/app/storage']
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: jobpilot
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.compose}
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: [CMD-SHELL, pg_isready -U jobpilot -d jobpilot]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: ['redisdata:/data']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    <<: *backend
    depends_on:
      postgres: {condition: service_healthy}
    command: [uv, run, --no-sync, alembic, upgrade, head]
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ['127.0.0.1:8000:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
  worker:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    command: [uv, run, --no-sync, celery, -A, 'app.workers.celery_app:celery_app', worker, -l, info]
  beat:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    volumes: ['beatdata:/home/appuser/beat', 'appstorage:/app/storage']
    command: [uv, run, --no-sync, celery, -A, 'app.workers.celery_app:celery_app', beat, -l, info, --schedule=/home/appuser/beat/schedule]
volumes:
  pgdata:
  redisdata:
  beatdata:
  appstorage:
