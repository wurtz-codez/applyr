name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ci-only-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      DATABASE_URL: postgresql+psycopg://jobpilot:test@localhost:5432/jobpilot
      APP_ENV: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobpilot
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U jobpilot -d jobpilot" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
      - run: uv run python ../../scripts/export_openapi.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build --webpack
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --project apps/api --frozen
      - name: Verify isolated MVP form workflow
        run: |
          uv run --project apps/api python scripts/smoke_mvp.py serve > "$RUNNER_TEMP/applyr-api.log" 2>&1 &
          api_pid=$!
          WATCHPACK_POLLING=true API_BASE_URL=http://127.0.0.1:8011 pnpm dev --webpack --port 3001 > "$RUNNER_TEMP/applyr-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          uv run --project apps/api python scripts/smoke_mvp.py check
